apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-app-stable
  namespace: devopsflow
spec:
  replicas: 2
  selector:
    matchLabels: {app: task-app, track: stable}
  template:
    metadata:
      labels: {app: task-app, track: stable}
    spec:
      containers:
        - name: app
          image: devopsflow-task-app:local
          ports: [{containerPort: 3000}]
          envFrom:
            - configMapRef: {name: task-app-config}
            - secretRef: {name: task-db-secret}
          readinessProbe:
            httpGet: {path: /health, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 3000}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
