apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: devopsflow
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: devopsflow
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: tasks}
            - {name: POSTGRES_USER, value: tasks_user}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: task-db-secret, key: DB_PASSWORD}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe:
            exec: {command: ["sh","-c","pg_isready -U tasks_user -d tasks"]}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-pvc}}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devopsflow
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]