
name: Build and deploy to local Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, devopsflow-local]

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish
        env:
          IMAGE: IMAGE: ghcr.io/ishikadev03/devopsflow-task-app
        run: |
          docker build -t "$IMAGE:${GITHUB_SHA}" "Capstone Project/application"
          docker push "$IMAGE:${GITHUB_SHA}"

      - name: Deploy to local Minikube
        env:
          IMAGE: IMAGE: ghcr.io/ishikadev03/devopsflow-task-app
        run: |
          /Docker/host/bin/kubectl.exe apply -f "Capstone Project/kubernetes/namespace.yaml"
          /Docker/host/bin/kubectl.exe apply -f "Capstone Project/kubernetes/postgres.yaml"
          /Docker/host/bin/kubectl.exe apply -f "Capstone Project/kubernetes/app-config.yaml"
          sed "s|IMAGE_PLACEHOLDER|$IMAGE:${GITHUB_SHA}|g" "Capstone Project/kubernetes/app-deployment.yaml" | /Docker/host/bin/kubectl.exe apply -f -
          /Docker/host/bin/kubectl.exe apply -f "Capstone Project/kubernetes/service.yaml"
          /Docker/host/bin/kubectl.exe rollout status deployment/task-app-stable -n devopsflow --timeout=180s
